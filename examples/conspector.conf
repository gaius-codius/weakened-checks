# conspector's config: the check config its scripts/check-weakened.sh listed,
# wherever the tools look for it (a crate can carry its own clippy.toml or
# rustfmt.toml), the wrapper lefthook runs the build and test checks
# through, and the unit settings that keep the key in (the templates
# and the script that renders them). Copy to .github/weakened-checks.conf.
config-path rust-toolchain rust-toolchain.toml deny.toml .config lefthook.yml
config-path .gitleaks.toml .gitleaksignore .github/workflows scripts/check-*
config-path scripts/without-git-env.sh systemd scripts/install-units.sh
config-path :(glob)**/.cargo/**
config-path :(glob)**/clippy.toml :(glob)**/.clippy.toml
config-path :(glob)**/rustfmt.toml :(glob)**/.rustfmt.toml
config-path :(glob)**/typos.toml :(glob)**/_typos.toml :(glob)**/.typos.toml
